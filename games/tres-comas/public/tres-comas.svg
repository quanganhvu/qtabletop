<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tres Comas: a squat tequila bottle with a big round cork, three gold commas on its label,
       a salt-rimmed shot and a lime wedge, on a banknote-green disc -->
  <defs>
    <radialGradient id="note" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#2f8a5c"/><stop offset="1" stop-color="#0f3d27"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe7ea" stop-opacity=".55"/><stop offset=".3" stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#9fc4c9" stop-opacity=".55"/></linearGradient>
    <linearGradient id="tequila" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#e09a2a"/></linearGradient>
    <radialGradient id="cork" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e8c08a"/><stop offset="1" stop-color="#9c6a34"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#e2b64c"/><stop offset="1" stop-color="#a87a1c"/></linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#note)"/>
  <g fill="none" stroke="#7fd1a4" stroke-opacity=".25" stroke-width=".6">
    <circle cx="32" cy="32" r="27"/><circle cx="32" cy="32" r="24.5" stroke-dasharray="1.5 1.5"/>
  </g>
  <ellipse cx="31" cy="54" rx="20" ry="2.6" fill="#000" opacity=".3"/>

  <!-- the bottle: a short, wide, thick-walled body and a stubby neck -->
  <path d="M26.5 20h9v4.5c0 1.2 1.2 1.6 3.4 2.4 3.4 1.2 5.1 3.3 5.1 6.6V50a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V33.5c0-3.3 1.7-5.4 5.1-6.6 2.2-.8 3.4-1.2 3.4-2.4z" fill="url(#glass)" stroke="#e9f6f7" stroke-opacity=".9" stroke-width="1"/>
  <!-- tequila inside -->
  <path d="M19.6 36h22.8V50a2.6 2.6 0 0 1-2.6 2.6H22.2a2.6 2.6 0 0 1-2.6-2.6z" fill="url(#tequila)" opacity=".9"/>
  <path d="M21 31.5c1-1.8 2.6-2.8 4.6-3.4" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M21.2 38v11" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
  <!-- the big round cork stopper -->
  <rect x="27.5" y="17" width="7" height="4" rx=".8" fill="#9c6a34"/>
  <circle cx="31" cy="13" r="6" fill="url(#cork)" stroke="#6b4420" stroke-width=".8"/>
  <path d="M27.6 11.6c.8-1.6 2.2-2.4 3.8-2.6" stroke="#fff3d6" stroke-width="1" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- the label: an agave leaf and three gold commas -->
  <rect x="21.5" y="38.5" width="19" height="11" rx="1.6" fill="#f6ecd2" stroke="url(#gold)" stroke-width="1.2"/>
  <g fill="#1f6b45">
    <circle cx="26.6" cy="43" r="1.7"/><path d="M28.2 43.2c0 2.3-1 3.6-2.5 4.1l-.4-.6c.9-.5 1.4-1.3 1.4-2.3z"/>
    <circle cx="31" cy="43" r="1.7"/><path d="M32.6 43.2c0 2.3-1 3.6-2.5 4.1l-.4-.6c.9-.5 1.4-1.3 1.4-2.3z"/>
    <circle cx="35.4" cy="43" r="1.7"/><path d="M37 43.2c0 2.3-1 3.6-2.5 4.1l-.4-.6c.9-.5 1.4-1.3 1.4-2.3z"/>
  </g>
  <path d="M31 40.2l-1.2-1.6M31 40.2l1.2-1.6M31 40.2V38.8" stroke="#3f8a5c" stroke-width=".7" stroke-linecap="round"/>

  <!-- a salt-rimmed shot glass and a lime wedge -->
  <path d="M45 40h8l-1.2 13h-5.6z" fill="url(#glass)" stroke="#e9f6f7" stroke-width=".8"/>
  <path d="M45.6 46h6.8l-.6 6.4h-5.6z" fill="url(#tequila)" opacity=".85"/>
  <path d="M44.6 40h8.8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray=".4 .9"/>
  <path d="M49.5 38.2a5.4 5.4 0 0 1 9 2.8z" fill="#9be05a" stroke="#3e7a1f" stroke-width=".8"/>
  <path d="M51 38.6l2.4 2.3M53.5 37.6l.6 3.2M56.2 38.2l-1.3 2.6" stroke="#e9ffd6" stroke-width=".5"/>

  <path d="M14 18l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z" fill="#fff0b8"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
</svg>
